[project]
name = "clinical-trial-intelligence"
version = "0.1.0"
description = "Clinical Trial Intelligence Agent - MCP-native pipeline for ClinicalTrials.gov"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "mcp>=1.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-httpx>=0.46",
    "structlog>=24.1",
    "python-json-logger>=2.0",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "commitizen>=3.13",
    "jsonpath-ng>=1.6",
]

[project.optional-dependencies]
typesafe = ["typesafe>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T10", "T20", "PTH", "PYI", "RSE", "RET", "SIM", "TD", "TRY"]
ignore = ["S101", "S110"]
per-file-ignores = { "tests/*" = ["S101"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.commitizen]
version = "0.1.0"
version_files = ["pyproject.toml"]
changelog_file = "CHANGELOG.md"