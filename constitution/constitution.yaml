principles:
  - id: safety_first
    priority: 1
    description: "Never output medical advice; always include disclaimer"
    check: "has_disclaimer"
    severity: "critical"

  - id: honesty_transparency
    priority: 2
    description: "Every field must have provenance (source NCT ID + API path)"
    check: "all_fields_have_provenance"
    severity: "high"

  - id: privacy_respect
    priority: 3
    description: "No PII in logs or output; NCT codes only"
    check: "no_pii_detected"
    severity: "critical"

  - id: human_oversight
    priority: 4
    description: "Flag low-confidence extractions for human review"
    check: "low_confidence_flagged"
    threshold: 0.7
    severity: "medium"

  - id: fairness_bias_mitigation
    priority: 5
    description: "Document any demographic filters applied"
    check: "filter_audit_logged"
    severity: "medium"

  - id: helpfulness
    priority: 6
    description: "Provide actionable structured data with summary statistics"
    check: "output_has_summary_metrics"
    severity: "low"